[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "authorized-security-lab"
version = "0.1.0"
description = "Safe, modular security assessment framework for authorized environments"
requires-python = ">=3.11"
dependencies = ["rich>=13.7,<15"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
